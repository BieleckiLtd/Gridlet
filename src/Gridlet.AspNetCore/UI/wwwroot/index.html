<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gridlet</title>
  <base href="%GRIDLET_BASE%/" />
  <link rel="icon" type="image/png" href="assets/icon_sm.png" />
  <link rel="apple-touch-icon" href="assets/icon_sm.png" />
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('gridlet.theme'); } catch { /* unavailable */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><img class="brand-mark" src="assets/icon_sm.png" alt="" /><span class="brand-name">Gridlet</span></div>
      <div class="connection-pickers" data-testid="connection-pickers" data-overflow-at="520">
        <div class="picker"><span class="picker-label">Connection</span>
          <select id="connection-select" aria-label="Connection"></select>
        </div>
        <div class="picker"><span class="picker-label">Database</span>
          <select id="database-select" aria-label="Database"></select>
        </div>
      </div>
      <button id="refresh-btn" class="ghost" title="Reload objects">⟳</button>
      <div class="spacer"></div>
      <button id="theme-btn" class="ghost theme-switch" title="Switch to light theme" aria-label="Switch to light theme">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path>
          <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"></path>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008"></path>
        </svg>
      </button>
      <button id="apis-btn" class="ghost app-action" title="Published API endpoints">
        <svg class="app-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M7 4a2 2 0 0 0 -2 2v3a2 3 0 0 1 -2 3a2 3 0 0 1 2 3v3a2 2 0 0 0 2 2"></path>
          <path d="M17 4a2 2 0 0 1 2 2v3a2 3 0 0 0 2 3a2 3 0 0 0 -2 3v3a2 2 0 0 1 -2 2"></path>
        </svg>
        <span>APIs</span>
      </button>
      <button id="ask-btn" class="ghost app-action" title="Talk with this database" data-testid="agent-open" hidden>
        <svg class="app-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12"></path>
          <path d="M9.5 9h.01"></path>
          <path d="M14.5 9h.01"></path>
          <path d="M9.5 13a3.5 3.5 0 0 0 5 0"></path>
        </svg>
        <span>Ask</span>
      </button>
      <button id="diagram-btn" class="ghost app-action" title="Open an ER diagram" data-testid="er-diagram-open">
        <svg class="app-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3" y="4" width="7" height="5" rx="1"></rect>
          <rect x="14" y="15" width="7" height="5" rx="1"></rect>
          <path d="M10 6.5h2a4 4 0 0 1 4 4V15"></path>
          <path d="M7 9v3a4 4 0 0 0 4 4h3"></path>
        </svg>
        <span>Diagram</span>
      </button>
      <button id="schema-compare-btn" class="ghost app-action" title="Compare database schemas" data-testid="schema-compare-open">
        <svg class="app-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 5h6v14h-6z"></path>
          <path d="M14 5h6v14h-6z"></path>
          <path d="M10 9h4m-2-2l2 2l-2 2"></path>
          <path d="M14 15h-4m2-2l-2 2l2 2"></path>
        </svg>
        <span>Compare</span>
      </button>
      <button id="object-search-btn" class="ghost app-action" title="Search objects across every connection" data-testid="object-search-open">
        <svg class="app-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="m15.5 15.5l5 5"></path>
        </svg>
        <span>Find</span>
      </button>
      <button id="new-query-btn" class="ghost app-action" title="Open an ad-hoc SQL workspace">
        <svg class="app-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0"></path>
          <path d="M4 6v6a8 3 0 0 0 16 0v-6"></path>
          <path d="M4 12v6a8 3 0 0 0 16 0v-6"></path>
        </svg>
        <span>Query</span>
      </button>
      <button id="about-btn" class="ghost app-action" title="About Gridlet, help, contributing, and licences">
        <svg class="app-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"></path>
          <path d="M12 9h.01"></path>
          <path d="M11 12h1v4h1"></path>
        </svg>
        <span>About</span>
      </button>
      <span id="version" class="muted"></span>
    </header>
    <div id="main">
      <aside id="sidebar" class="side-rail">
        <div class="rail-head sidebar-head">
          <button id="sidebar-toggle" class="ghost panel-toggle" title="Collapse the object sidebar" aria-label="Collapse the object sidebar" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"></path>
              <path d="M9 4l0 16"></path>
            </svg>
          </button>
          <input id="search" type="search" placeholder="Filter objects…" autocomplete="off" />
        </div>
        <div id="tree" class="tree"></div>
        <div id="sidebar-grip" role="separator" aria-label="Resize sidebar" aria-orientation="vertical" tabindex="0"></div>
      </aside>
      <section id="content">
        <div id="tabbar"></div>
        <div id="panels"></div>
        <div id="empty-state">
          <div class="empty-inner">
            <img class="empty-mark" src="assets/icon.png" alt="Gridlet" />
            <p>Select a database object from the sidebar:<br />or open an ad-hoc SQL workspace.</p>
          </div>
        </div>
      </section>
    </div>
  </div>
  <div id="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <script src="assets/sql-docs.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
