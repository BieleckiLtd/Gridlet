name: Publish

# A successful merge to main is a release. The workflow validates the version,
# publishes every packable project, and then creates the matching GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version '$version' must be stable SemVer (X.Y.Z)."
          }
          if (git tag --list "v$version") {
            throw "Tag v$version already exists. Increment Directory.Build.props before merging to main."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build --configuration Release

      - name: Install browser test runtime
        run: pwsh tests/Gridlet.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --configuration Release --output ${{ github.workspace }}/artifacts/nupkg

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Gridlet-${{ steps.version.outputs.version }}
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: BieleckiLtd

      - name: Push
        run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create "v$VERSION"
          artifacts/nupkg/*.nupkg
          --target "$GITHUB_SHA"
          --title "Gridlet $VERSION"
          --generate-notes
